<!doctype html>
<!-- Sonar: acoustic echogram. The speaker plays chirps, the microphone records them, pulse compression turns echoes into distance. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Sonar</title>
<style>
:root { --bg: #0a0c0d; --ink: #e9eeec; --dim: rgba(233, 238, 236, .52); --faint: rgba(233, 238, 236, .1); --acc: #6fffc8; --err: #ff5a4d; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; }
header { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 22px 10px; }
h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .01em; }
#status { color: var(--dim); font-variant-numeric: tabular-nums; }
#status.err { color: var(--err); }
#stage { position: relative; flex: 1; min-height: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#intro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; }
#intro[hidden] { display: none; }
#intro p { margin: 0; font-size: 22px; line-height: 1.3; font-weight: 500; letter-spacing: -.01em; }
#intro small { color: var(--dim); font-size: 13px; }
#start { all: unset; cursor: pointer; padding: 11px 30px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 600; transition: transform .15s ease; }
#start:active { transform: scale(.96); }
footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 26px; padding: 14px 22px 18px; }
footer[hidden] { display: none; }
.group { display: flex; align-items: center; gap: 10px; color: var(--dim); }
.seg { display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--faint); }
.seg button { all: unset; cursor: pointer; padding: 5px 12px; border-radius: 7px; color: var(--dim); transition: background .15s ease, color .15s ease; }
.seg button.on { background: var(--ink); color: var(--bg); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 110px; height: 3px; border-radius: 2px; background: var(--faint); outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--ink); cursor: pointer; }
#stop { all: unset; cursor: pointer; padding: 5px 14px; border-radius: 9px; background: var(--faint); color: var(--ink); }
</style>
</head>
<body>
<div id="app">
  <header><h1>Sonar</h1><span id="status"></span></header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="intro">
      <p>The speaker chirps, the microphone listens.<br>Every echo becomes a distance.</p>
      <button id="start">Start</button>
      <small>Built-in speakers, volume around half. It will tick.</small>
    </div>
  </main>
  <footer id="controls" hidden>
    <div class="group">Show<div class="seg" data-key="mode"><button data-v="all" class="on">Everything</button><button data-v="motion">Motion</button></div></div>
    <div class="group">Band<div class="seg" data-key="band"><button data-v="wide" class="on">Wide</button><button data-v="high">High</button><button data-v="quiet">Quiet</button></div></div>
    <div class="group">Range<div class="seg" data-key="range"><button data-v="2">2 m</button><button data-v="4" class="on">4 m</button><button data-v="8">8 m</button></div></div>
    <div class="group">Volume<input id="vol" type="range" min="0.1" max="1" step="0.01" value="0.35"></div>
    <button id="stop">Stop</button>
  </footer>
</div>
<script>
const C = 343, N = 8192, CHIRP = 2048, MAX_RANGE = 8;
const BANDS = { wide: [2000, 20000], high: [10000, 21000], quiet: [17000, 22000] };
const BG = [10, 12, 13], ACC = [111, 255, 200];

const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('cv'), g = cv.getContext('2d'), statusEl = $('status');
const state = { on: false, mode: 'all', band: 'wide', range: 4, vol: 0.35, lo: null, hi: null, tau: null, taus: [], jumps: 0, hot: 0, ref: 0, tail: null, snr: 0, info: '' };
const L = { W: 0, H: 0 };

let ctx;
try { ctx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' }); } catch (e) { ctx = new AudioContext(); }
let fs = ctx.sampleRate, node = null, stream = null, mic = null, moduleReady = false, waveId = 0, lastGain = -1;
let fall = document.createElement('canvas'), fg = fall.getContext('2d'), rowImg = null;
let kLo = 0, kHi = 0, M = 0, seen = 0;

const cosT = new Float64Array(N / 2), sinT = new Float64Array(N / 2), rev = new Uint16Array(N);
for (let i = 0; i < N / 2; i++) { cosT[i] = Math.cos(2 * Math.PI * i / N); sinT[i] = Math.sin(2 * Math.PI * i / N); }
for (let i = 0, bits = Math.log2(N); i < N; i++) { let r = 0; for (let b = 0; b < bits; b++) if (i & (1 << b)) r |= 1 << (bits - 1 - b); rev[i] = r; }

const re = new Float64Array(N), im = new Float64Array(N), Hr = new Float64Array(N), Hi = new Float64Array(N);
const ar = new Float64Array(N), ai = new Float64Array(N), gr = new Float64Array(N), gi = new Float64Array(N);
let bgR, bgI, avR, avI, magAll, magMot, vals, scan, rowVals, xa, xb, sorted;

const LUT = new Uint8Array(256 * 3);
for (let i = 0; i < 256; i++) {
  const t = Math.pow(i / 255, 0.85);
  for (let c = 0; c < 3; c++) {
    LUT[i * 3 + c] = t < 0.75 ? BG[c] + (ACC[c] - BG[c]) * (t / 0.75) : ACC[c] + (255 - ACC[c]) * ((t - 0.75) / 0.25);
  }
}

function fft(a, b) {
  for (let i = 0; i < N; i++) {
    const j = rev[i];
    if (j > i) { let t = a[i]; a[i] = a[j]; a[j] = t; t = b[i]; b[i] = b[j]; b[j] = t; }
  }
  for (let size = 2; size <= N; size <<= 1) {
    const half = size >> 1, step = N / size;
    for (let i = 0; i < N; i += size) {
      for (let j = 0, k = 0; j < half; j++, k += step) {
        const wr = cosT[k], wi = -sinT[k], p = i + j, q = p + half;
        const tr = a[q] * wr - b[q] * wi, ti = a[q] * wi + b[q] * wr;
        a[q] = a[p] - tr; b[q] = b[p] - ti; a[p] += tr; b[p] += ti;
      }
    }
  }
}

function ifft(a, b) {
  fft(b, a);
  for (let i = 0; i < N; i++) { a[i] /= N; b[i] /= N; }
}

function makeChirp(f1, f2) {
  const w = new Float32Array(N), rate = (f2 - f1) / (CHIRP / fs), taper = 0.08 * CHIRP;
  for (let i = 0; i < CHIRP; i++) {
    const t = i / fs, edge = Math.min(i, CHIRP - 1 - i) / taper;
    const a = edge >= 1 ? 1 : 0.5 - 0.5 * Math.cos(Math.PI * edge);
    w[i] = a * Math.sin(2 * Math.PI * (f1 * t + 0.5 * rate * t * t));
  }
  return w;
}

function resetScale() {
  state.lo = null; state.hi = null;
  if (scan) scan.fill(-200);
}

function resetModel() {
  seen = 0; state.tau = null; state.taus = []; state.jumps = 0; state.ref = 0; state.tail = null;
  resetScale();
}

function setBand() {
  const f1 = BANDS[state.band][0], f2 = Math.min(BANDS[state.band][1], fs / 2 - 1500);
  const wave = makeChirp(f1, f2);
  re.set(wave); im.fill(0); fft(re, im);
  kLo = Math.round(f1 * N / fs); kHi = Math.round(f2 * N / fs);
  let pmax = 0;
  for (let k = kLo; k <= kHi; k++) pmax = Math.max(pmax, re[k] * re[k] + im[k] * im[k]);
  gr.fill(0); gi.fill(0);
  for (let k = kLo; k <= kHi; k++) {
    const w = 1 - Math.cos(2 * Math.PI * (k - kLo) / (kHi - kLo));
    const d = re[k] * re[k] + im[k] * im[k] + pmax * 1e-3;
    gr[k] = re[k] / d * w; gi[k] = -im[k] / d * w;
  }
  state.info = (fs / 1000).toFixed(fs % 1000 ? 1 : 0) + ' kHz · resolution ' + (C / (f2 - f1) * 100).toFixed(1) + ' cm';
  resetModel();
  node.port.postMessage({ wave, id: ++waveId });
}

function setGain() {
  node.port.postMessage({ gain: state.vol * state.vol });
}

function alloc() {
  M = Math.ceil(MAX_RANGE * 2 * fs / C) + 4;
  bgR = new Float64Array(M); bgI = new Float64Array(M); avR = new Float64Array(M); avI = new Float64Array(M);
  magAll = new Float32Array(M); magMot = new Float32Array(M); vals = new Float32Array(M);
}

function onPing(m) {
  if (m.id !== waveId || m.k < 2) return;
  if (m.g !== lastGain) { lastGain = m.g; seen = 0; state.ref = 0; state.tail = null; return; }
  const rec = m.rec;
  let peak = 0;
  for (let i = 0; i < N; i++) { const v = rec[i]; re[i] = v; im[i] = 0; const a = v < 0 ? -v : v; if (a > peak) peak = a; }
  state.hot = peak > 0.6 ? state.hot + 1 : 0;
  if (state.hot >= 3 && state.vol > 0.1) {
    state.hot = 0; state.vol = Math.max(0.1, state.vol * 0.85); $('vol').value = state.vol; setGain();
  }
  fft(re, im);
  Hr.fill(0); Hi.fill(0);
  for (let k = kLo; k <= kHi; k++) { Hr[k] = re[k] * gr[k] - im[k] * gi[k]; Hi[k] = re[k] * gi[k] + im[k] * gr[k]; }
  ar.set(Hr); ai.set(Hi); ifft(ar, ai);
  let p = 0, best = 0;
  for (let i = 0; i < N; i++) { const e = ar[i] * ar[i] + ai[i] * ai[i]; if (e > best) { best = e; p = i; } }
  const at = i => { const j = (i + N) % N; return Math.hypot(ar[j], ai[j]); };
  const a = at(p - 1), b = at(p), c = at(p + 1), den = a - 2 * b + c;
  const tauNow = p + (den ? 0.5 * (a - c) / den : 0);
  if (state.taus.length < 7) {
    state.taus.push(tauNow);
    const s = state.taus.slice().sort((x, y) => x - y);
    state.tau = s[s.length >> 1]; seen = 0;
  } else {
    let d = tauNow - state.tau;
    if (d > N / 2) d -= N; else if (d < -N / 2) d += N;
    if (Math.abs(d) <= 2) { state.jumps = 0; state.tau += 0.05 * Math.max(-0.1, Math.min(0.1, d)); }
    else if (++state.jumps >= 6) { state.taus = [tauNow]; state.tau = tauNow; state.jumps = 0; seen = 0; }
  }
  const tau = state.tau;
  ar.fill(0); ai.fill(0);
  for (let k = kLo; k <= kHi; k++) {
    const ph = 2 * Math.PI * k * tau / N, cs = Math.cos(ph), sn = Math.sin(ph);
    ar[k] = Hr[k] * cs - Hi[k] * sn; ai[k] = Hr[k] * sn + Hi[k] * cs;
  }
  ifft(ar, ai);
  let tail = 0;
  for (let n = M; n < N / 2; n++) tail += ar[n] * ar[n] + ai[n] * ai[n];
  tail = 10 * Math.log10(tail / (N / 2 - M) + 1e-30);
  const burst = state.tail !== null && tail > state.tail + 8;
  state.tail = state.tail === null ? tail : state.tail + (burst ? 0.05 : 0.2) * (tail - state.tail);
  if (burst) return;
  const h0 = Math.hypot(ar[0], ai[0]);
  state.ref = state.ref ? state.ref + 0.1 * (h0 - state.ref) : h0;
  state.snr = 20 * Math.log10(h0 + 1e-30) - tail;
  const aBg = seen < 4 ? 1 / (seen + 1) : 0.08, aAv = seen < 2 ? 1 : 0.35;
  for (let n = 0; n < M; n++) {
    const dr = ar[n] - bgR[n], di = ai[n] - bgI[n];
    magMot[n] = Math.hypot(dr, di);
    bgR[n] += aBg * dr; bgI[n] += aBg * di;
    avR[n] += aAv * (ar[n] - avR[n]); avI[n] += aAv * (ai[n] - avI[n]);
    magAll[n] = Math.hypot(avR[n], avI[n]);
  }
  seen++;
  if (peak > 0.95) setStatus('Microphone is clipping. Lower the system volume.', true);
  else if (state.snr < 25) setStatus('No direct signal. Use the built-in speakers and raise the volume.');
  else setStatus(state.info);
  const motion = state.mode === 'motion';
  if (motion && seen < 6) return;
  const mags = motion ? magMot : magAll, kr = C / (2 * fs);
  for (let n = 0; n < M; n++) vals[n] = 20 * Math.log10(mags[n] / state.ref + 1e-9) + 20 * Math.log10(Math.max(n * kr, 0.1));
  pushRow();
  render();
}

function setStatus(text, err) {
  if (statusEl.textContent !== text) statusEl.textContent = text;
  statusEl.classList.toggle('err', !!err);
}

function layout() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2), r = stage.getBoundingClientRect();
  const W = Math.max(240, Math.round(r.width * dpr)), H = Math.max(240, Math.round(r.height * dpr));
  if (W === L.W && H === L.H) return;
  cv.width = W; cv.height = H;
  Object.assign(L, { W, H, dpr, scanH: Math.round(H * 0.3), axisH: Math.round(30 * dpr), row: Math.max(2, Math.round(3 * dpr)) });
  L.fallY = L.scanH + L.axisH; L.fallH = H - L.fallY;
  const next = document.createElement('canvas');
  next.width = W; next.height = L.fallH;
  const ng = next.getContext('2d');
  ng.fillStyle = 'rgb(' + BG + ')'; ng.fillRect(0, 0, W, L.fallH);
  if (fall.width) ng.drawImage(fall, 0, 0, W, fall.height);
  fall = next; fg = ng;
  rowImg = fg.createImageData(W, L.row);
  scan = new Float32Array(W).fill(-200); rowVals = new Float32Array(W); sorted = new Float32Array(W);
  xa = new Float32Array(W); xb = new Float32Array(W);
  mapBins();
  render();
}

function mapBins() {
  const k = 2 * fs / C * state.range / L.W;
  for (let x = 0; x < L.W; x++) { xa[x] = x * k; xb[x] = (x + 1) * k; }
  L.near = Math.round(0.25 / state.range * L.W);
  resetScale();
}

function pushRow() {
  const { W, row, near } = L;
  let top = -1e9;
  for (let x = 0; x < W; x++) {
    const a = xa[x], b = xb[x];
    if (b - a <= 1) {
      const c = (a + b) / 2, i = Math.floor(c), f = c - i;
      rowVals[x] = vals[i] * (1 - f) + vals[Math.min(i + 1, M - 1)] * f;
    } else {
      let m = -1e9;
      for (let i = Math.floor(a); i < b && i < M; i++) if (vals[i] > m) m = vals[i];
      rowVals[x] = m;
    }
    scan[x] = scan[x] < -150 ? rowVals[x] : scan[x] + 0.5 * (rowVals[x] - scan[x]);
    if (x >= near && rowVals[x] > top) top = rowVals[x];
  }
  sorted.set(rowVals); sorted.sort();
  const motion = state.mode === 'motion';
  const loT = sorted[W >> 1] + (motion ? 9 : 5), hiT = Math.max(loT + (motion ? 18 : 15), top + 2);
  if (state.lo === null) { state.lo = loT; state.hi = hiT; }
  else { state.lo += 0.1 * (loT - state.lo); state.hi += (hiT > state.hi ? 0.5 : 0.04) * (hiT - state.hi); }
  const lo = state.lo, span = state.hi - lo, d = rowImg.data;
  for (let x = 0; x < W; x++) {
    let t = (rowVals[x] - lo) / span;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const c = ((t * 255) | 0) * 3;
    for (let y = 0; y < row; y++) {
      const o = (y * W + x) * 4;
      d[o] = LUT[c]; d[o + 1] = LUT[c + 1]; d[o + 2] = LUT[c + 2]; d[o + 3] = 255;
    }
  }
  fg.drawImage(fall, 0, row);
  fg.putImageData(rowImg, 0, 0);
}

function render() {
  const { W, H, dpr, scanH, axisH, fallY, near } = L;
  if (!W) return;
  g.fillStyle = 'rgb(' + BG + ')'; g.fillRect(0, 0, W, H);
  if (!node && state.lo === null) return;
  g.drawImage(fall, 0, fallY);
  const R = state.range, step = R <= 2 ? 0.25 : R <= 4 ? 0.5 : 1;
  g.font = Math.round(11 * dpr) + 'px -apple-system, system-ui, sans-serif';
  g.textBaseline = 'middle';
  for (let r = 0; r <= R + 1e-6; r += step) {
    const x = Math.min(Math.round(r / R * W), W - 1), last = r > R - 1e-6;
    g.fillStyle = 'rgba(233,238,236,.07)'; g.fillRect(x, 0, 1, scanH);
    g.fillStyle = 'rgba(233,238,236,.3)'; g.fillRect(x, scanH, 1, 5 * dpr);
    g.fillStyle = 'rgba(233,238,236,.52)';
    g.textAlign = r === 0 ? 'left' : last ? 'right' : 'center';
    g.fillText(r === 0 ? '0' : parseFloat(r.toFixed(2)) + ' m', r === 0 ? 6 * dpr : last ? W - 6 * dpr : x, scanH + axisH * 0.58);
  }
  if (state.lo === null) return;
  const lo = state.lo, span = state.hi - lo, top = 30 * dpr, usable = scanH - top - 2 * dpr;
  const yOf = v => { const t = (v - lo) / span; return top + (1 - (t < 0 ? 0 : t > 1 ? 1 : t)) * usable; };
  g.beginPath();
  g.moveTo(0, scanH);
  for (let x = 0; x < W; x++) g.lineTo(x, yOf(scan[x]));
  g.lineTo(W, scanH); g.closePath();
  g.fillStyle = 'rgba(111,255,200,.09)'; g.fill();
  g.beginPath();
  for (let x = 0; x < W; x++) { const y = yOf(scan[x]); if (x) g.lineTo(x, y); else g.moveTo(x, y); }
  g.strokeStyle = 'rgb(' + ACC + ')'; g.lineWidth = 1.25 * dpr; g.lineJoin = 'round'; g.stroke();
  const pxm = W / R, hood = Math.max(2, Math.round(0.06 * pxm)), gap = 0.3 * pxm, found = [];
  for (let x = near; x < W - 1; x++) {
    const v = scan[x];
    if (v < lo + 6) continue;
    let isMax = true;
    for (let j = Math.max(0, x - hood); j <= Math.min(W - 1, x + hood); j++) if (scan[j] > v) { isMax = false; break; }
    if (isMax) found.push(x);
  }
  found.sort((p, q) => scan[q] - scan[p]);
  const picked = [];
  for (const x of found) { if (picked.length < 3 && picked.every(q => Math.abs(q - x) > gap)) picked.push(x); }
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.font = '600 ' + Math.round(12 * dpr) + 'px -apple-system, system-ui, sans-serif';
  for (const x of picked) {
    const y = yOf(scan[x]);
    g.fillStyle = 'rgb(' + ACC + ')'; g.beginPath(); g.arc(x, y, 3 * dpr, 0, 6.2832); g.fill();
    g.fillStyle = '#e9eeec';
    g.fillText((x / pxm).toFixed(2) + ' m', Math.min(Math.max(x, 26 * dpr), W - 26 * dpr), Math.max(y - 9 * dpr, 13 * dpr));
  }
}

const workletSrc = `
class SonarIO extends AudioWorkletProcessor {
  constructor() {
    super();
    this.wave = null; this.pending = null; this.rec = null; this.pos = 0; this.k = 0; this.id = 0; this.gain = 0.1; this.g = 0.1; this.alive = true;
    this.port.onmessage = e => {
      const m = e.data;
      if (m.wave) this.pending = m;
      if (m.gain !== undefined) this.gain = m.gain;
      if (m.stop) this.alive = false;
    };
  }
  process(inputs, outputs) {
    const out = outputs[0][0], inp = inputs[0] && inputs[0][0];
    for (let i = 0; i < out.length; i++) {
      if (this.pos === 0) {
        if (this.pending) { this.wave = this.pending.wave; this.id = this.pending.id; this.pending = null; this.k = 0; }
        if (this.wave) { this.rec = new Float32Array(this.wave.length); this.g = this.gain; }
      }
      if (!this.wave) continue;
      out[i] = this.wave[this.pos] * this.g;
      this.rec[this.pos] = inp ? inp[i] : 0;
      if (++this.pos === this.wave.length) {
        this.port.postMessage({ rec: this.rec, id: this.id, k: this.k++, g: this.g }, [this.rec.buffer]);
        this.pos = 0;
      }
    }
    return this.alive;
  }
}
registerProcessor('sonar-io', SonarIO);
`;
const workletUrl = 'data:text/javascript;charset=utf-8,' + encodeURIComponent(workletSrc);

async function start() {
  const resumed = ctx.resume();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
  } catch (e) {
    setStatus('Microphone blocked. Allow it and press Start again.', true);
    ctx.suspend();
    return;
  }
  await resumed;
  if (!moduleReady) { await ctx.audioWorklet.addModule(workletUrl); moduleReady = true; }
  fs = ctx.sampleRate;
  alloc();
  node = new AudioWorkletNode(ctx, 'sonar-io', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2] });
  node.port.onmessage = e => onPing(e.data);
  mic = ctx.createMediaStreamSource(stream);
  mic.connect(node); node.connect(ctx.destination);
  state.on = true; lastGain = -1;
  $('intro').hidden = true; $('controls').hidden = false;
  $('stop').textContent = 'Stop';
  layout(); mapBins();
  setGain(); setBand();
}

function stop() {
  node.port.postMessage({ stop: true });
  mic.disconnect(); node.disconnect();
  stream.getTracks().forEach(t => t.stop());
  ctx.suspend();
  state.on = false;
  $('stop').textContent = 'Start';
  setStatus('Paused');
}

$('start').addEventListener('click', start);
$('stop').addEventListener('click', () => state.on ? stop() : start());
$('vol').addEventListener('input', e => { state.vol = +e.target.value; if (state.on) setGain(); });
document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  seg.querySelectorAll('button').forEach(o => o.classList.toggle('on', o === b));
  const key = seg.dataset.key;
  state[key] = key === 'range' ? +b.dataset.v : b.dataset.v;
  if (key === 'band' && state.on) setBand();
  else if (key === 'range') { mapBins(); render(); }
  else if (key === 'mode') resetScale();
}));
new ResizeObserver(layout).observe(stage);
</script>
</body>
</html>
