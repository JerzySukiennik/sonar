name: Sonar
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Sonar:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.gzowo.sonar.ios
        PRODUCT_NAME: Sonar
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sonar
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Sonar uses the camera only to track how the phone moves.
        NSMicrophoneUsageDescription: Sonar listens for echoes of its own chirps.
